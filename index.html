<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Website</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-50 text-slate-800">

    <!-- Navbar -->
    <div class="border-b border-slate-200 bg-white">
        <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-2 px-4 py-3 md:flex-row">

            <!-- Logo -->
            <a href="#" class="text-xl font-bold text-indigo-600">Brand</a>

            <!-- Links -->
            <div class="flex flex-wrap items-center justify-center gap-1">
                <a href="#" class="rounded-md bg-indigo-50 px-3 py-2 text-sm font-medium text-indigo-600">Home</a>
                <a href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900">Features</a>
                <a href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900">Pricing</a>
                <a href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900">About</a>
                <a href="#"
                    class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 hover:text-slate-900">Contact</a>
            </div>

            <!-- Actions -->
            <div class="flex items-center gap-2">
                <a href="#" class="rounded-md px-3 py-2 text-sm font-medium text-slate-600 hover:text-slate-900">Log
                    in</a>
                <a href="#"
                    class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-500">Sign
                    up</a>
            </div>
        </div>
    </div>

    <!-- Hero -->
    <article class="relative">
        <img class="h-[32rem] w-full object-cover md:h-[40rem]"
            src="https://uploads-ssl.webflow.com/665b91c255aa4f8228a5ee8b/665df7ee45dacc0915bd4955_Ashira%2Bwork%2Bthumbnail.webp"
            alt="car photo" />

        <div class="absolute inset-0 bg-black/30">
            <div class="mx-auto flex h-full max-w-6xl flex-col justify-center gap-6 px-4">

                <p class="text-4xl font-bold text-white sm:text-5xl lg:text-7xl">
                    Book a Car Near You <br> And Drive In <br> Minutes.
                </p>

                <div class="flex flex-col gap-3 sm:flex-row">
                    <button class="flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-6 py-4 text-white">
                        <img class="w-8 sm:w-10"
                            src="https://static.vecteezy.com/system/resources/thumbnails/070/730/255/small/computer-logo-white-phone-icon-in-transparent-background-free-png.png"
                            alt="logo"> APP STORE
                    </button>
                    <button class="flex items-center justify-center gap-2 rounded-xl bg-slate-900 px-6 py-4 text-white">
                        <img class="w-8 sm:w-10"
                            src="https://static0.anpoimages.com/wordpress/wp-content/uploads/2022/07/Google-Play-logo-2022.jpeg?q=50&fit=crop&w=480&dpr=1.5"
                            alt="google play"> GOOGLE PLAY
                    </button>
                </div>

                <a href="#ourCars"
                    class="block w-full cursor-pointer rounded-2xl bg-slate-700 py-4 text-center text-xl text-white hover:bg-slate-900 sm:w-80 sm:text-2xl">
                    See Our Cars <span class="ml-4">&rarr;</span>
                </a>

            </div>
        </div>
    </article>

    <!-- Cars -->
    <div id="ourCars" class="mt-10 scroll-mt-4 bg-zinc-400 py-6 text-slate-100">
        <div class="mx-auto grid max-w-6xl grid-cols-1 gap-6 px-4 md:grid-cols-2 lg:grid-cols-3">

            <div class="flex flex-col bg-white pb-4">
                <img class="h-56 w-full object-cover"
                    src="https://img.magnific.com/premium-photo/photorealistic-hyper-realistic-image-white-background-ai-generated-by-freepik_643360-536430.jpg?semt=ais_hybrid&w=740&q=80"
                    alt="bmw m5">
                <h3 class="px-3 text-2xl text-black">BMW M5 White Color</h3>
                <h3 class="px-3 text-xl text-black">From <span class="font-bold text-lime-500">5900$</span></h3>
                <button
                    class="mx-3 mt-5 h-10 cursor-pointer rounded-md bg-blue-900 px-3 text-white hover:bg-indigo-500">See
                    Details</button>
            </div>

            <div class="flex flex-col bg-white pb-4">
                <img class="h-56 w-full object-cover"
                    src="https://di-uploads-pod5.dealerinspire.com/waltersmercedesbenz/uploads/2016/04/cls-coupe-no-background.png"
                    alt="mercedes cls">
                <h3 class="px-3 text-2xl text-black">Mercedes Cls White Color</h3>
                <h3 class="px-3 text-xl text-black">From <span class="font-bold text-lime-500">6100$</span></h3>
                <button
                    class="mx-3 mt-5 h-10 cursor-pointer rounded-md bg-blue-900 px-3 text-white hover:bg-indigo-500">See
                    Details</button>
            </div>

            <div class="flex flex-col bg-white pb-4 md:col-span-2 lg:col-span-1">
                <img class="h-56 w-full object-cover"
                    src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTo34wPzzm3WHEpPcxSPcdC_4exiZvigT67WahwDlrpS2yk3bFOqeqMj5Q&s=10"
                    alt="mustang">
                <h3 class="px-3 text-2xl text-black">Mustang white</h3>
                <h3 class="px-3 text-xl text-black">From <span class="font-bold text-lime-500">6000$</span></h3>
                <button
                    class="mx-3 mt-5 h-10 cursor-pointer rounded-md bg-blue-900 px-3 text-white hover:bg-indigo-500">See
                    Details</button>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 bg-slate-900 text-slate-300">
        <div class="mx-auto flex max-w-6xl flex-col items-center justify-between gap-4 px-4 py-8 md:flex-row">
            <p class="text-sm">&copy; 2026 Brand. ყველა უფლება დაცულია.</p>
            <div class="flex gap-4">
                <a href="https://facebook.com" class="hover:text-white">Facebook</a>
                <a href="https://instagram.com" class="hover:text-white">Instagram</a>
                <a href="https://x.com" class="hover:text-white">X</a>
            </div>
        </div>
    </footer>

</body>

</html>
